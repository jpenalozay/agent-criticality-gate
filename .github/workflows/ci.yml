name: CI — Gate & Benchmark Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package & core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests python-dotenv jsonschema psutil
          pip install -e . --no-deps
      - name: Run 12-test verification suite
        run: python -m unittest discover -s tests -v
      - name: Run live CLI demo
        run: python demo.py
