[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-criticality-gate"
version = "0.1.0"
description = "Hybrid LLM + deterministic lexical criticality gate and adaptive Human-in-the-Loop (HITL) coordinator for multi-agent systems."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Jose Luis Penaloza Yaurivilca", email = "jpenalozay@gmail.com" }
]
keywords = [
    "ai-agents",
    "human-in-the-loop",
    "hitl",
    "llm-guardrails",
    "multi-agent-systems",
    "ai-safety",
    "criticality-gate"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "datasets>=2.16.0",
    "huggingface-hub>=0.20.0",
    "tqdm>=4.66.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "scikit-learn>=1.3.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0"
]

[project.urls]
Homepage = "https://github.com/jpenalozay/agent-criticality-gate"
Repository = "https://github.com/jpenalozay/agent-criticality-gate"
Issues = "https://github.com/jpenalozay/agent-criticality-gate/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentes*", "src*"]
